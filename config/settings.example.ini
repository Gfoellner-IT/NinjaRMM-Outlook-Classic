; Synthetic non-secret example. Copy to the location described in docs/configuration.md.
; Do not put ClientId, ClientSecret, access tokens or refresh tokens in this file.
[Settings]
ApiBaseUrl=https://tenant.example.invalid/v2/
CredentialTarget=NinjaRMM-Outlook-Classic/API
AllowedSender=IT Support | Example
TicketSubjectPattern=^\[example\]\s*\(#(\d+)\)(.*)
TicketPrefixPattern=TICKET \(Example - ([A-Z]+)\)( / )
OrganizationPrefixPattern=^\s*Example\s*:?\s*-?\s*
ExcludedDomains=github.com,newsletter.example
AllTicketsBoard=2

; Optional: only for the explicitly invoked LiveTests runner.
; Select an open ticket with no prior closing event and a closed ticket with a closing event.
; LiveOpenTicketId=
; LiveClosedTicketId=
; LiveVendorTicketId=
; LiveVendorNumber=
